name: dartframe
description: DartFrame is a Dart library inspired by Pandas and NumPy, simplifying structured data handling (tables, CSVs, JSON) with function tools for filtering, transforming, and analysis.
version: 0.9.0
repository: https://github.com/gameticharles/DartFrame

environment:
  sdk: ^3.6.0

documentation: "https://github.com/gameticharles/DartFrame/blob/main/doc/dataframe.md"

# Add regular dependencies here.
dependencies:
  archive: ^4.0.0
  intl: ^0.20.2
  web: ^1.1.1
  r_tree: ^3.0.1
  excel_plus: ^2.16.0
  csv_plus: ^1.4.0
  http: ^1.2.0
  # Database packages
  postgres: ^3.5.9
  sqlite3: ^3.0.1
  mysql_client_plus: ^0.1.2

dev_dependencies:
  benchmark_harness: ^2.3.1
  lints: ^6.0.0
  test: ^1.24.0

topics:
  - dataframe
  - datacube
  - series
  - ndrrray
  - scaler
